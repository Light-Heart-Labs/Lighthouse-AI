schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: qdrant
  name: Qdrant (Vector DB)
  aliases: [vector]
  container_name: ods-qdrant
  host_env: QDRANT_HOST
  default_host: qdrant
  port: 6333
  external_port_env: QDRANT_PORT
  external_port_default: 6333
  health: /
  ui_path: /dashboard
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  env_vars:
    # Qdrant reads QDRANT__SERVICE__API_KEY and serves every request
    # unauthenticated when it is empty, while network-exposure-policy.json
    # marks this service auth_required: true.
    - key: QDRANT_API_KEY
      required: true
      secret: true
      description: Qdrant vector DB API key
