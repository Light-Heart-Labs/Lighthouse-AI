services:
  surreal-vector:
    build:
      context: .
      dockerfile: Dockerfile
    image: ods-surreal-vector:local
    container_name: ods-surreal-vector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - SURREALDB_URL=${SURREAL_VECTOR_SURREAL_URL:-http://surrealdb:8000}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS:?SURREALDB_PASS must be set}
      - SURREAL_VECTOR_NS=${SURREAL_VECTOR_NS:-ods}
      - SURREAL_VECTOR_DB=${SURREAL_VECTOR_DB:-rag}
      - SURREAL_VECTOR_DEFAULT_DIM=${SURREAL_VECTOR_DEFAULT_DIM:-768}
      - QDRANT_API_KEY=${SURREAL_VECTOR_API_KEY:-${QDRANT_API_KEY:-}}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SURREAL_VECTOR_PORT:-6335}:6333"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6333/readyz')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ods-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ods-network:
    external: true
