services:
  apache-tika:
    image: apache/tika:3.2.3.0-full
    container_name: ods-apache-tika
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APACHE_TIKA_PORT:-9998}:9998"
    volumes:
      - ./data/apache-tika/extras:/tika-extras:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ods-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  ods-network:
    external: true
